openapi: 3.1.0
info:
  title: clusterd
  version: 2.0.0
  summary: Platform API of the homelab
  description: |
    One stateless instance per hypervisor behind a highly available address.
    Every endpoint except /v1/health needs `Authorization: Bearer <token>`.
    Scopes nest: manage ⊃ operator ⊃ read. Errors are `{"error": "..."}`.

    Resources: every collection answers `{"items": [...], "errors": [...]}`
    (errors lists parts that couldn't be read) and `/{name}` answers one
    item. Actions are `POST /v1/<resource>/{name}/<action>`: with
    `dry_run=true` the plan comes back (200) and nothing changes; otherwise
    the action starts and the answer is its operation (202, `Location:
    /v1/operations/{id}`), or with `wait=true` its progress as JSON lines.

    Stable from 2.0.0: /v1 only changes in backward-compatible ways (new
    endpoints, new optional fields); anything breaking goes to /v2.
    Handbook: https://jurrebuunk.github.io/nix-hgd1-cluster/reference/api/
servers:
  - url: https://api.lan.buunk.org
security:
  - bearer: []

paths:
  /v1/health:
    get:
      summary: This instance serves requests (Keepalived's check)
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /v1/whoami:
    get:
      summary: The calling token, and which instance answered
      x-scope: read
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Whoami" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/internal/node:
    get:
      summary: Facts about the answering host only (peers ask it for /v1/status)
      x-scope: read
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Node" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/status:
    get:
      summary: "Everything at once: hosts, VMs, nodes, Ceph, VIPs, disks, S3"
      x-scope: read
      description: |
        Asks every peer with the caller's own token. Parts that fail are
        reported in place (unreachable host, k3s error, ceph error); the call
        itself still succeeds.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/checks:
    get:
      summary: One verdict for the site, per area (ok, warn, fail)
      x-scope: read
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Checks" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/hosts:
    get:
      summary: "Hypervisors: reachability, version, uptime, load, memory, maintenance"
      x-scope: read
      description: |
        Asks every host with the caller's token; an unreachable one is listed with its error.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HostList" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/hosts/{name}:
    get:
      summary: "One hypervisor"
      x-scope: read
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HostStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/hosts/{name}/maintenance:
    post:
      summary: "Take a host out: drain and stop its VMs, set noout for its OSDs"
      description: |
        Runs on the host itself (others forward). Refuses (412) when another host
        is in maintenance, a node elsewhere isn't Ready, etcd would lose quorum or
        `ceph osd ok-to-stop` says no. The host stays in maintenance (Ceph's
        per-host noout flag) until resume. With reboot=true the host reboots right
        after the action ends.
      x-scope: manage
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/DryRun" }
        - { $ref: "#/components/parameters/Wait" }
        - { name: reboot, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: The plan (dry_run) or the progress stream (wait)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HostPlan" }
            application/x-ndjson:
              schema: { $ref: "#/components/schemas/ActionEvent" }
        "202": { $ref: "#/components/responses/Started" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Busy" }
        "412": { $ref: "#/components/responses/Unsafe" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/NoKubernetes" }

  /v1/hosts/{name}/resume:
    post:
      summary: "Bring a host back: start its VMs, wait Ready, uncordon, unset noout, wait for clean PGs"
      description: |
        Runs on the host itself, so the host must be up.
      x-scope: manage
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/DryRun" }
        - { $ref: "#/components/parameters/Wait" }
      responses:
        "200":
          description: The plan (dry_run) or the progress stream (wait)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HostPlan" }
            application/x-ndjson:
              schema: { $ref: "#/components/schemas/ActionEvent" }
        "202": { $ref: "#/components/responses/Started" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Busy" }
        "412": { $ref: "#/components/responses/Unsafe" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/NoKubernetes" }

  /v1/vms:
    get:
      summary: "VMs from the inventory and their state"
      x-scope: read
      description: |
        Asks every host with the caller's token.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VMList" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/vms/{name}:
    get:
      summary: "One VM"
      x-scope: read
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VMStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/vms/{name}/restart:
    post:
      summary: "Restart a VM safely: cordon, drain, restart, wait Ready, uncordon"
      description: |
        Runs on the VM's own host; another instance forwards the request there
        with the caller's token. One disruptive action runs at a time across the
        cluster (a Kubernetes Lease). The action finishes even if the client
        disconnects.
        Preconditions: the VM is enabled in the inventory, every other node is
        Ready, etcd keeps quorum, and no pod without a controller would be lost.
      x-scope: operator
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/DryRun" }
        - { $ref: "#/components/parameters/Wait" }
      responses:
        "200":
          description: The plan (dry_run) or the progress stream (wait)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RestartPlan" }
            application/x-ndjson:
              schema: { $ref: "#/components/schemas/ActionEvent" }
        "202": { $ref: "#/components/responses/Started" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Busy" }
        "412": { $ref: "#/components/responses/Unsafe" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/NoKubernetes" }

  /v1/vms/{name}/stop:
    post:
      summary: "Stop a VM safely: cordon, drain, stop; the node stays cordoned"
      description: |
        Runs on the VM's own host; another instance forwards the request there
        with the caller's token. One disruptive action runs at a time across the
        cluster (a Kubernetes Lease). The action finishes even if the client
        disconnects.
        A stopped VM starts again when its host boots; to keep it off, disable it
        in the inventory.
      x-scope: operator
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/DryRun" }
        - { $ref: "#/components/parameters/Wait" }
      responses:
        "200":
          description: The plan (dry_run) or the progress stream (wait)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RestartPlan" }
            application/x-ndjson:
              schema: { $ref: "#/components/schemas/ActionEvent" }
        "202": { $ref: "#/components/responses/Started" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Busy" }
        "412": { $ref: "#/components/responses/Unsafe" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/NoKubernetes" }

  /v1/vms/{name}/start:
    post:
      summary: "Start a stopped VM, wait until its node is Ready, uncordon"
      description: |
        Runs on the VM's own host; another instance forwards the request there
        with the caller's token. One disruptive action runs at a time across the
        cluster (a Kubernetes Lease). The action finishes even if the client
        disconnects.
        412 when the VM runs already.
      x-scope: operator
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/DryRun" }
        - { $ref: "#/components/parameters/Wait" }
      responses:
        "200":
          description: The plan (dry_run) or the progress stream (wait)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RestartPlan" }
            application/x-ndjson:
              schema: { $ref: "#/components/schemas/ActionEvent" }
        "202": { $ref: "#/components/responses/Started" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Busy" }
        "412": { $ref: "#/components/responses/Unsafe" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/NoKubernetes" }

  /v1/nodes:
    get:
      summary: "Kubernetes nodes"
      x-scope: read
      description: |
        When the k3s API is unreachable the list is empty and errors says why.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeList" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/nodes/{name}:
    get:
      summary: "One Kubernetes node"
      x-scope: read
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/K3sNode" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/NoKubernetes" }

  /v1/nodes/{name}/cordon:
    post:
      summary: "Mark a node unschedulable"
      description: |
        Done when it answers: the operation comes back finished.
      x-scope: operator
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The finished operation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Operation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/NoKubernetes" }

  /v1/nodes/{name}/uncordon:
    post:
      summary: "Mark a node schedulable again"
      description: |
        Done when it answers: the operation comes back finished.
      x-scope: operator
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The finished operation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Operation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/NoKubernetes" }

  /v1/pods:
    get:
      summary: "Kubernetes pods of every namespace"
      x-scope: read
      description: |
        When the k3s API can't be reached the list is empty and errors says why.
      parameters:
        - { name: failing, in: query, schema: { type: boolean }, description: "Only pods that need a look (see Pod.failing)" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PodList" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/ceph:
    get:
      summary: "Ceph health and raw capacity (refreshed every 10 s)"
      x-scope: read
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CephStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/ceph/osds:
    get:
      summary: "Ceph OSDs: size, usage, up and in (refreshed every 60 s)"
      x-scope: read
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OSDList" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/disks:
    get:
      summary: "Physical disks: size, usage, wear, temperature, SMART"
      x-scope: read
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiskList" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/filesystems:
    get:
      summary: "Filesystems of hosts and VMs"
      x-scope: read
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FilesystemList" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/vips:
    get:
      summary: "Floating addresses and which host holds each"
      x-scope: read
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VIPList" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/s3:
    get:
      summary: "The object store: gateways, totals, room left, certificate"
      x-scope: read
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/S3Status" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/s3/buckets:
    get:
      summary: "Buckets with usage and quotas"
      x-scope: read
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BucketList" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/s3/buckets/{name}:
    get:
      summary: "One bucket"
      x-scope: read
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/S3Bucket" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/operations:
    get:
      summary: "Actions of the last day (or since), newest first"
      x-scope: read
      description: |
        Read from the audit records every action writes to the journal, as
        VictoriaLogs has them (a few seconds behind). Without events.
      parameters:
        - { name: since, in: query, schema: { type: string, default: 24h }, description: "Go duration, up to 744h" }
        - { name: target, in: query, schema: { type: string }, description: "Only actions on this VM, node or host" }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /v1/operations/{id}:
    get:
      summary: "One action with its progress lines"
      x-scope: read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: "^[0-9a-f]{16}$" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Operation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /v1/metrics/query:
    get:
      summary: Instant query (VictoriaMetrics /api/v1/query)
      x-scope: read
      parameters:
        - { $ref: "#/components/parameters/PromQuery" }
        - { name: time, in: query, schema: { type: string } }
      # Proxied: the store's own status and body, this host's store first,
      # peers on connection errors and 5xx.
      responses: &proxied
        "200": { description: The store's response }
        "400": { description: The store rejected the query }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/BadGateway" }
  /v1/metrics/query_range:
    get:
      summary: Range query (VictoriaMetrics /api/v1/query_range)
      x-scope: read
      parameters:
        - { $ref: "#/components/parameters/PromQuery" }
        - { name: start, in: query, required: true, schema: { type: string } }
        - { name: end, in: query, schema: { type: string } }
        - { name: step, in: query, schema: { type: string } }
      responses: *proxied
  /v1/metrics/series:
    get:
      summary: Series matching selectors (VictoriaMetrics /api/v1/series)
      x-scope: read
      responses: *proxied
  /v1/metrics/labels:
    get:
      summary: Label names (VictoriaMetrics /api/v1/labels)
      x-scope: read
      responses: *proxied
  /v1/metrics/label/{name}/values:
    get:
      summary: Values of one label (VictoriaMetrics /api/v1/label/{name}/values)
      x-scope: read
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string, pattern: "^[a-zA-Z_][a-zA-Z0-9_]*$" }
      responses: *proxied

  /v1/logs/query:
    get:
      summary: LogsQL search, or follow with follow=1
      description: |
        Without follow: VictoriaLogs /select/logsql/query, JSON lines; a missing
        `limit` defaults to the server's logs_limit (1000). With follow=1:
        /select/logsql/tail, streamed until the client disconnects or the
        server's follow_max (1h) passes.
      x-scope: read
      parameters:
        - { name: query, in: query, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1 } }
        - { name: follow, in: query, schema: { type: boolean } }
      responses: *proxied
  /v1/logs/hits:
    get:
      summary: Hit counts over time (VictoriaLogs /select/logsql/hits)
      x-scope: read
      responses: *proxied
  /v1/logs/streams:
    get:
      summary: Log streams (VictoriaLogs /select/logsql/streams)
      x-scope: read
      responses: *proxied

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: A token from `labctl token new`, format lab_<43 base64url chars>.

  parameters:
    DryRun:
      name: dry_run
      in: query
      description: Only return the plan; nothing changes
      schema: { type: boolean }
    Wait:
      name: wait
      in: query
      description: Stream progress as JSON lines until the action ends, instead of 202
      schema: { type: boolean }
    PromQuery:
      name: query
      in: query
      required: true
      schema: { type: string }

  responses:
    Unauthorized:
      description: Token missing or invalid
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Token valid, scope too low
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such endpoint or resource
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Busy:
      description: Another action holds the lock (the message names it)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unsafe:
      description: Not safe right now (the message says why); nothing changed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NoKubernetes:
      description: This instance has no Kubernetes access
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Started:
      description: The action started; Location is its operation
      headers:
        Location: { schema: { type: string }, description: "/v1/operations/{id}" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Operation" }
    BadRequest:
      description: An invalid parameter
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadGateway:
      description: No monitoring or log store, or the VM's host, answered
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    Health:
      type: object
      properties:
        status: { type: string, const: ok }
    Whoami:
      type: object
      properties:
        site: { type: string }
        host: { type: string, description: Instance that answered }
        name: { type: string, description: Token name }
        scope: { type: string, enum: [read, operator, manage] }
        version: { type: string, description: clusterd version }
    StoreHealth:
      type: object
      properties:
        name: { type: string, enum: [victoriametrics, victorialogs] }
        ok: { type: boolean }
    Node:
      type: object
      properties:
        host: { type: string }
        version: { type: string }
        uptime_seconds: { type: integer }
        load1: { type: number }
        mem_total_bytes: { type: integer }
        mem_available_bytes: { type: integer }
        vips: { type: array, items: { type: string }, description: Names of VIPs bound here }
        vms:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              active: { type: string, description: systemd ActiveState }
              sub: { type: string, description: systemd SubState }
        stores: { type: array, items: { $ref: "#/components/schemas/StoreHealth" } }
        nixos: { $ref: "#/components/schemas/NixOS" }
        errors: { type: array, items: { type: string } }
    Status:
      type: object
      properties:
        site: { type: string }
        generated_at: { type: string, format: date-time }
        served_by: { type: string }
        hosts: { type: array, items: { $ref: "#/components/schemas/HostStatus" } }
        vms: { type: array, items: { $ref: "#/components/schemas/VMStatus" } }
        k3s: { $ref: "#/components/schemas/K3sStatus" }
        ceph: { $ref: "#/components/schemas/CephStatus" }
        vips: { type: array, items: { $ref: "#/components/schemas/VIPStatus" } }
        disks: { $ref: "#/components/schemas/DisksStatus" }
        s3: { $ref: "#/components/schemas/S3Status" }
    HostList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/HostStatus" } }
        errors: { type: array, items: { type: string } }
    VMList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/VMStatus" } }
        errors: { type: array, items: { type: string } }
    NodeList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/K3sNode" } }
        errors: { type: array, items: { type: string } }
    VIPList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/VIPStatus" } }
        errors: { type: array, items: { type: string } }
    DiskList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Disk" } }
        errors: { type: array, items: { type: string } }
    FilesystemList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Filesystem" } }
        errors: { type: array, items: { type: string } }
    OSDList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/OSD" } }
        errors: { type: array, items: { type: string } }
    BucketList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/S3Bucket" } }
        errors: { type: array, items: { type: string } }
    PodList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Pod" } }
        errors: { type: array, items: { type: string } }
    OperationList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Operation" } }
        errors: { type: array, items: { type: string } }
    NixOS:
      type: object
      properties:
        version: { type: string }
        revision: { type: string, description: "Git commit of the flake the system was built from (system.configurationRevision)" }
        generation: { type: integer, description: The system profile's generation }
        reboot_required: { type: boolean, description: "Kernel, initrd or modules differ from the booted system's" }
    Pod:
      type: object
      properties:
        namespace: { type: string }
        name: { type: string }
        node: { type: string }
        phase: { type: string }
        ready: { type: integer, description: Containers that are ready }
        containers: { type: integer }
        restarts: { type: integer }
        last_restart: { type: string, format: date-time }
        reason: { type: string, description: "CrashLoopBackOff, ImagePullBackOff, Evicted, …" }
        created: { type: string, format: date-time }
        failing:
          type: boolean
          description: |
            Failed or Unknown, Pending or not ready for over 5 minutes, a
            container crash-looping or unable to pull, or restarted in the
            last hour.
    HostStatus:
      type: object
      properties:
        name: { type: string }
        nixos: { $ref: "#/components/schemas/NixOS" }
        reachable: { type: boolean }
        version: { type: string }
        uptime_seconds: { type: integer }
        load1: { type: number }
        mem_used_percent: { type: number }
        stores: { type: array, items: { $ref: "#/components/schemas/StoreHealth" } }
        maintenance: { type: boolean, description: "Ceph's per-host noout flag is set (host maintenance)" }
        error: { type: string }
    VMStatus:
      type: object
      properties:
        name: { type: string }
        host: { type: string }
        state: { type: string, enum: [running, starting, stopped, failed, missing, disabled, unknown] }
    K3sStatus:
      type: object
      properties:
        reachable: { type: boolean }
        error: { type: string }
        nodes: { type: array, items: { $ref: "#/components/schemas/K3sNode" } }
    K3sNode:
      type: object
      properties:
        name: { type: string }
        ready: { type: boolean }
        schedulable: { type: boolean }
        roles: { type: array, items: { type: string } }
        version: { type: string }
        zone: { type: string }
    CephStatus:
      type: object
      properties:
        health: { type: string }
        checks: { type: array, items: { type: string } }
        osds_total: { type: integer }
        osds_up: { type: integer }
        osds_in: { type: integer }
        pgs_total: { type: integer }
        pgs_active_clean: { type: integer }
        bytes_total: { type: integer, description: Raw capacity of all OSDs }
        bytes_used: { type: integer }
        bytes_avail: { type: integer }
        error: { type: string }
        as_of: { type: string, format: date-time, description: "When Ceph was asked; refreshed every 10 s" }
    VIPStatus:
      type: object
      properties:
        name: { type: string }
        address: { type: string }
        owners: { type: array, items: { type: string }, description: "More than one: split brain" }
    DisksStatus:
      type: object
      properties:
        disks: { type: array, items: { $ref: "#/components/schemas/Disk" } }
        filesystems: { type: array, items: { $ref: "#/components/schemas/Filesystem" } }
        osds: { type: array, items: { $ref: "#/components/schemas/OSD" } }
        errors: { type: array, items: { type: string } }
    S3Status:
      type: object
      properties:
        endpoint: { type: string }
        gateways:
          type: array
          items:
            type: object
            properties:
              host: { type: string }
              up: { type: boolean }
        users: { type: integer, description: Not counting the API's own read-only user }
        buckets: { type: integer }
        objects: { type: integer }
        size_bytes: { type: integer, description: What the buckets hold (one copy) }
        pool:
          type: object
          properties:
            name: { type: string }
            stored_bytes: { type: integer }
            max_avail_bytes: { type: integer, description: Room left for data, after replication }
            used_percent: { type: number }
        cert_expires: { type: string, format: date-time }
        errors: { type: array, items: { type: string } }
    Disk:
      type: object
      properties:
        host: { type: string }
        device: { type: string, description: "nvme0, sda" }
        type: { type: string, enum: [nvme, ssd, hdd] }
        model: { type: string }
        serial: { type: string }
        role: { type: string, description: '"system", "data", "osd.N" or empty when unknown' }
        size_bytes: { type: integer }
        used_bytes: { type: integer, description: "The OSD's usage, or the filesystems on the disk's partitions" }
        used_percent: { type: number }
        wear_percent: { type: number, description: NVMe endurance used; absent for HDDs }
        temperature_c: { type: number }
        healthy: { type: boolean, description: SMART overall assessment }
        power_on_hours: { type: integer }
        media_errors: { type: integer }
    Filesystem:
      type: object
      properties:
        host: { type: string, description: Host or VM }
        mountpoint: { type: string }
        device: { type: string }
        fstype: { type: string }
        size_bytes: { type: integer }
        used_bytes: { type: integer }
        used_percent: { type: number, description: "Like df: of the space usable without root's reserve" }
    OSD:
      type: object
      properties:
        id: { type: integer }
        host: { type: string }
        device: { type: string }
        device_class: { type: string }
        size_bytes: { type: integer }
        used_bytes: { type: integer }
        used_percent: { type: number }
        up: { type: boolean }
        in: { type: boolean }
    S3Bucket:
      type: object
      properties:
        name: { type: string }
        owner: { type: string }
        objects: { type: integer }
        size_bytes: { type: integer }
        quota_bytes: { type: integer, description: 0 means no quota }
        quota_objects: { type: integer, description: 0 means no quota }
        created: { type: string, format: date-time }
    RestartPlan:
      type: object
      properties:
        vm: { type: string }
        host: { type: string }
        roles: { type: array, items: { type: string } }
        evict: { type: array, items: { type: string }, description: "Pods the drain moves, namespace/name" }
        skipped: { type: integer, description: DaemonSet and static pods, which stay }
        steps: { type: array, items: { type: string } }
        lock_holder: { type: string, description: Set when another action runs right now }
    ActionEvent:
      type: object
      required: [time, status, message]
      properties:
        time: { type: string, format: date-time }
        status: { type: string, enum: [progress, done, error] }
        message: { type: string }
    HostPlan:
      type: object
      properties:
        host: { type: string }
        vms: { type: array, items: { type: string }, description: In the order they are handled (agents first) }
        osds: { type: array, items: { type: integer } }
        steps: { type: array, items: { type: string } }
        lock_holder: { type: string }
    Checks:
      type: object
      properties:
        status: { type: string, enum: [ok, warn, fail], description: The worst of all checks }
        checks:
          type: array
          items:
            type: object
            properties:
              name: { type: string, description: "hosts, units, vms, nodes, pods, ceph, vips, disks, s3, tunnel, monitoring" }
              status: { type: string, enum: [ok, warn, fail] }
              message: { type: string }
    Operation:
      type: object
      required: [id, action, target, host, token, state, started]
      properties:
        id: { type: string, description: The request ID of the instance that ran it }
        action: { type: string, description: '"vm restart", "vm stop", "vm start", "node cordon", "node uncordon", "host maintenance", "host resume"' }
        target: { type: string }
        host: { type: string, description: The hypervisor that ran it }
        token: { type: string, description: Name of the token that asked }
        state: { type: string, enum: [running, succeeded, failed, unknown], description: "unknown: no end recorded within the action's time limit" }
        started: { type: string, format: date-time }
        finished: { type: string, format: date-time }
        error: { type: string }
        events: { type: array, items: { $ref: "#/components/schemas/ActionEvent" }, description: Only on a single operation }
