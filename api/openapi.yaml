openapi: 3.1.0
info:
  title: clusterd
  version: 1.1.0
  summary: Platform API of the homelab
  description: |
    One stateless instance per hypervisor behind a highly available address.
    Every endpoint except /v1/health needs `Authorization: Bearer <token>`.
    Scopes nest: manage ⊃ operator ⊃ read. Errors are `{"error": "..."}`.
    Stable from 1.0.0: /v1 only changes in backward-compatible ways (new
    endpoints, new optional fields); anything breaking goes to /v2.
    Handbook: https://jurrebuunk.github.io/nix-hgd1-cluster/reference/api/
servers:
  - url: https://api.lan.buunk.org
security:
  - bearer: []

paths:
  /v1/health:
    get:
      summary: This instance serves requests (Keepalived's check)
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /v1/whoami:
    get:
      summary: The calling token, and which instance answered
      x-scope: read
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Whoami" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/node:
    get:
      summary: Facts about the answering host only (used by /v1/status on peers)
      x-scope: read
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Node" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/status:
    get:
      summary: Everything at once; each part is also its own /v1/status/<part>
      description: |
        Asks every peer's /v1/node with the caller's own token. Parts that fail
        are reported in place (unreachable host, k3s error, ceph error); the
        call itself still succeeds.
      x-scope: read
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/status/hosts:
    get:
      summary: "Hypervisors: reachability, version, uptime, load, memory, stores"
      x-scope: read
      description: Asks every host (/v1/node) with the caller's token.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HostsStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/status/vms:
    get:
      summary: VMs from the inventory and their state
      x-scope: read
      description: Asks every host (/v1/node) with the caller's token.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VMsStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/status/k3s:
    get:
      summary: Kubernetes nodes
      x-scope: read
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/K3sStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/status/ceph:
    get:
      summary: Ceph health and raw capacity (refreshed every 10 s)
      x-scope: read
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CephStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/status/vips:
    get:
      summary: Which host holds each floating address
      x-scope: read
      description: Asks every host (/v1/node) with the caller's token.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VIPsStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/status/disks:
    get:
      summary: Physical disks (size, how full, wear, SMART), filesystems and OSDs
      x-scope: read
      description: From the SMART and node metrics (about 30 s old) and Ceph (about 60 s).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DisksStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/status/s3:
    get:
      summary: "Object store: gateways, users, buckets with usage and quotas, pool room, certificate"
      x-scope: read
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/S3Status" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/metrics/query:
    get:
      summary: Instant query (VictoriaMetrics /api/v1/query)
      x-scope: read
      parameters:
        - { $ref: "#/components/parameters/PromQuery" }
        - { name: time, in: query, schema: { type: string } }
      # Proxied: the store's own status and body, this host's store first,
      # peers on connection errors and 5xx.
      responses: &proxied
        "200": { description: The store's response }
        "400": { description: The store rejected the query }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/BadGateway" }
  /v1/metrics/query_range:
    get:
      summary: Range query (VictoriaMetrics /api/v1/query_range)
      x-scope: read
      parameters:
        - { $ref: "#/components/parameters/PromQuery" }
        - { name: start, in: query, required: true, schema: { type: string } }
        - { name: end, in: query, schema: { type: string } }
        - { name: step, in: query, schema: { type: string } }
      responses: *proxied
  /v1/metrics/series:
    get:
      summary: Series matching selectors (VictoriaMetrics /api/v1/series)
      x-scope: read
      responses: *proxied
  /v1/metrics/labels:
    get:
      summary: Label names (VictoriaMetrics /api/v1/labels)
      x-scope: read
      responses: *proxied
  /v1/metrics/label/{name}/values:
    get:
      summary: Values of one label (VictoriaMetrics /api/v1/label/{name}/values)
      x-scope: read
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string, pattern: "^[a-zA-Z_][a-zA-Z0-9_]*$" }
      responses: *proxied

  /v1/logs/query:
    get:
      summary: LogsQL search, or follow with follow=1
      description: |
        Without follow: VictoriaLogs /select/logsql/query, JSON lines; a missing
        `limit` defaults to the server's logs_limit (1000). With follow=1:
        /select/logsql/tail, streamed until the client disconnects or the
        server's follow_max (1h) passes.
      x-scope: read
      parameters:
        - { name: query, in: query, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1 } }
        - { name: follow, in: query, schema: { type: boolean } }
      responses: *proxied
  /v1/logs/hits:
    get:
      summary: Hit counts over time (VictoriaLogs /select/logsql/hits)
      x-scope: read
      responses: *proxied
  /v1/logs/streams:
    get:
      summary: Log streams (VictoriaLogs /select/logsql/streams)
      x-scope: read
      responses: *proxied

  /v1/actions/vms/{name}/restart:
    post:
      summary: Restart a VM safely (cordon, drain, restart, wait Ready, uncordon)
      description: |
        Runs on the VM's own host; another instance forwards the request there
        with the caller's token. Preconditions: the VM is enabled in the
        inventory, every other node is Ready, etcd keeps quorum, and no pod
        without a controller would be lost. One disruptive action runs at a
        time across the cluster (a Kubernetes Lease). Progress streams as JSON
        lines; the action finishes even if the client disconnects. With
        dry_run=1 nothing changes and the plan comes back.
      x-scope: operator
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
        - { name: dry_run, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: The plan (dry run) or the progress stream
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RestartPlan" }
            application/x-ndjson:
              schema: { $ref: "#/components/schemas/ActionEvent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Another action holds the lock
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "412":
          description: Not safe right now (the message says why)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503":
          description: This instance has no Kubernetes access
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: A token from `labctl token new`, format lab_<43 base64url chars>.

  parameters:
    PromQuery:
      name: query
      in: query
      required: true
      schema: { type: string }

  responses:
    Unauthorized:
      description: Token missing or invalid
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Token valid, scope too low
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such endpoint or action
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadGateway:
      description: No monitoring store, or the VM's host, answered
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    Health:
      type: object
      properties:
        status: { type: string, const: ok }
    Whoami:
      type: object
      properties:
        site: { type: string }
        host: { type: string, description: Instance that answered }
        name: { type: string, description: Token name }
        scope: { type: string, enum: [read, operator, manage] }
        version: { type: string, description: clusterd version }
    StoreHealth:
      type: object
      properties:
        name: { type: string, enum: [victoriametrics, victorialogs] }
        ok: { type: boolean }
    Node:
      type: object
      properties:
        host: { type: string }
        version: { type: string }
        uptime_seconds: { type: integer }
        load1: { type: number }
        mem_total_bytes: { type: integer }
        mem_available_bytes: { type: integer }
        vips: { type: array, items: { type: string }, description: Names of VIPs bound here }
        vms:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              active: { type: string, description: systemd ActiveState }
              sub: { type: string, description: systemd SubState }
        stores: { type: array, items: { $ref: "#/components/schemas/StoreHealth" } }
        errors: { type: array, items: { type: string } }
    Status:
      type: object
      properties:
        site: { type: string }
        generated_at: { type: string, format: date-time }
        served_by: { type: string }
        hosts: { type: array, items: { $ref: "#/components/schemas/HostStatus" } }
        vms: { type: array, items: { $ref: "#/components/schemas/VMStatus" } }
        k3s: { $ref: "#/components/schemas/K3sStatus" }
        ceph: { $ref: "#/components/schemas/CephStatus" }
        vips: { type: array, items: { $ref: "#/components/schemas/VIPStatus" } }
        disks: { $ref: "#/components/schemas/DisksStatus" }
        s3: { $ref: "#/components/schemas/S3Status" }
    HostsStatus:
      type: object
      properties:
        hosts: { type: array, items: { $ref: "#/components/schemas/HostStatus" } }
    VMsStatus:
      type: object
      properties:
        vms: { type: array, items: { $ref: "#/components/schemas/VMStatus" } }
    VIPsStatus:
      type: object
      properties:
        vips: { type: array, items: { $ref: "#/components/schemas/VIPStatus" } }
    HostStatus:
      type: object
      properties:
        name: { type: string }
        reachable: { type: boolean }
        version: { type: string }
        uptime_seconds: { type: integer }
        load1: { type: number }
        mem_used_percent: { type: number }
        stores: { type: array, items: { $ref: "#/components/schemas/StoreHealth" } }
        error: { type: string }
    VMStatus:
      type: object
      properties:
        name: { type: string }
        host: { type: string }
        state: { type: string, enum: [running, starting, stopped, failed, missing, disabled, unknown] }
    K3sStatus:
      type: object
      properties:
        reachable: { type: boolean }
        error: { type: string }
        nodes:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              ready: { type: boolean }
              schedulable: { type: boolean }
              roles: { type: array, items: { type: string } }
              version: { type: string }
              zone: { type: string }
    CephStatus:
      type: object
      properties:
        health: { type: string }
        checks: { type: array, items: { type: string } }
        osds_total: { type: integer }
        osds_up: { type: integer }
        osds_in: { type: integer }
        pgs_total: { type: integer }
        pgs_active_clean: { type: integer }
        bytes_total: { type: integer, description: Raw capacity of all OSDs }
        bytes_used: { type: integer }
        bytes_avail: { type: integer }
        error: { type: string }
        as_of: { type: string, format: date-time, description: "When Ceph was asked; refreshed every 10 s" }
    VIPStatus:
      type: object
      properties:
        name: { type: string }
        address: { type: string }
        owners: { type: array, items: { type: string }, description: "More than one: split brain" }
    DisksStatus:
      type: object
      properties:
        disks:
          type: array
          items:
            type: object
            properties:
              host: { type: string }
              device: { type: string, description: "nvme0, sda" }
              type: { type: string, enum: [nvme, ssd, hdd] }
              model: { type: string }
              serial: { type: string }
              role: { type: string, description: '"system", "data", "osd.N" or empty when unknown' }
              size_bytes: { type: integer }
              used_bytes: { type: integer, description: "The OSD's usage, or the filesystems on the disk's partitions" }
              used_percent: { type: number }
              wear_percent: { type: number, description: NVMe endurance used; absent for HDDs }
              temperature_c: { type: number }
              healthy: { type: boolean, description: SMART overall assessment }
              power_on_hours: { type: integer }
              media_errors: { type: integer }
        filesystems:
          type: array
          items:
            type: object
            properties:
              host: { type: string, description: Host or VM }
              mountpoint: { type: string }
              device: { type: string }
              fstype: { type: string }
              size_bytes: { type: integer }
              used_bytes: { type: integer }
              used_percent: { type: number, description: "Like df: of the space usable without root's reserve" }
        osds:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              host: { type: string }
              device: { type: string }
              device_class: { type: string }
              size_bytes: { type: integer }
              used_bytes: { type: integer }
              used_percent: { type: number }
              up: { type: boolean }
              in: { type: boolean }
        errors: { type: array, items: { type: string } }
    S3Status:
      type: object
      properties:
        endpoint: { type: string }
        gateways:
          type: array
          items:
            type: object
            properties:
              host: { type: string }
              up: { type: boolean }
        users: { type: integer, description: Not counting the API's own read-only user }
        buckets:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              owner: { type: string }
              objects: { type: integer }
              size_bytes: { type: integer }
              quota_bytes: { type: integer, description: 0 means no quota }
              quota_objects: { type: integer, description: 0 means no quota }
              created: { type: string, format: date-time }
        objects: { type: integer }
        size_bytes: { type: integer, description: What the buckets hold (one copy) }
        pool:
          type: object
          properties:
            name: { type: string }
            stored_bytes: { type: integer }
            max_avail_bytes: { type: integer, description: Room left for data, after replication }
            used_percent: { type: number }
        cert_expires: { type: string, format: date-time }
        errors: { type: array, items: { type: string } }
    RestartPlan:
      type: object
      properties:
        vm: { type: string }
        host: { type: string }
        roles: { type: array, items: { type: string } }
        evict: { type: array, items: { type: string }, description: "Pods the drain moves, namespace/name" }
        skipped: { type: integer, description: DaemonSet and static pods, which stay }
        steps: { type: array, items: { type: string } }
        lock_holder: { type: string, description: Set when another action runs right now }
    ActionEvent:
      type: object
      required: [time, status, message]
      properties:
        time: { type: string, format: date-time }
        status: { type: string, enum: [progress, done, error] }
        message: { type: string }
